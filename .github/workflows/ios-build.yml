name: "Free iOS Build"

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Force iOS 15.1 Target
        run: |
          # This command finds any remaining 13.0 references and forces them to 15.1
          find ios -type f -name "*.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0/IPHONEOS_DEPLOYMENT_TARGET = 15.1/g' {} +
          find ios -type f -name "*.plist" -exec sed -i '' 's/13.0/15.1/g' {} +

      - name: Create iOS Build Config
        run: flutter build ios --release --no-codesign --config-only

      - name: Install CocoaPods
        run: |
          cd ios
          rm -rf Podfile.lock
          pod install --repo-update

      - name: Inject GoogleService-Info.plist
        run: |
          PBX_PATH="ios/Runner.xcodeproj/project.pbxproj"
          
          # 1. Clean up any previous failed attempts (Remove our custom ID if it exists)
          sed -i '' '/D73872AD237909A100904033/d' "$PBX_PATH"
          sed -i '' '/D73872AC237909A100904033/d' "$PBX_PATH"

          # 2. Add the File Reference to the 'Main Group'
          # We search for the end of the PBXFileReference section
          sed -i '' '/\/* Begin PBXFileReference section *\//a\'$'\n''		D73872AC237909A100904033 /* GoogleService-Info.plist */ = {isa = PBXFileReference; fileEncoding = 4; lastKnownFileType = text.plist.xml; path = "GoogleService-Info.plist"; sourceTree = "<group>"; };' "$PBX_PATH"

          # 3. Add the Build File to the Build Resources section
          sed -i '' '/\/* Begin PBXBuildFile section *\//a\'$'\n''		D73872AD237909A100904033 /* GoogleService-Info.plist in Resources */ = {isa = PBXBuildFile; fileRef = D73872AC237909A100904033 /* GoogleService-Info.plist */; };' "$PBX_PATH"

          # 4. Add it to the actual Resources Build Phase so it gets packaged
          # This looks for the start of the Resources section and adds our file
          sed -i '' '/\/* Resources *\//a\'$'\n''				D73872AD237909A100904033 /* GoogleService-Info.plist in Resources */,' "$PBX_PATH"
          
          echo "Surgery complete. Project file repaired and Firebase injected."
      - name: Build iOS App Bundle
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload
          zip -r YourTutorApp.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: my-ios-app
          path: YourTutorApp.ipa