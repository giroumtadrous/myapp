name: "Free iOS Build"

on:
  push:
    branches: [ main ]  # Runs automatically when you push to main
  workflow_dispatch:     # Also allows you to click "Run workflow" manually

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # Step 1: Build the .app bundle (No certificate needed)
      - name: Build iOS App Bundle
        run: flutter build ios --release --no-codesign

      # Step 2: Manually wrap it into a .ipa for sideloading
      - name: Package IPA
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload
          zip -r YourTutorApp.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: my-ios-app
          path: YourTutorApp.ipa