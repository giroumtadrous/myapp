name: "Free iOS Build"

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Force iOS 15.1 Target
        run: |
          # This command finds any remaining 13.0 references and forces them to 15.1
          find ios -type f -name "*.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0/IPHONEOS_DEPLOYMENT_TARGET = 15.1/g' {} +
          find ios -type f -name "*.plist" -exec sed -i '' 's/13.0/15.1/g' {} +

      - name: Create iOS Build Config
        run: flutter build ios --release --no-codesign --config-only

      - name: Install CocoaPods
        run: |
          cd ios
          rm -rf Podfile.lock
          pod install --repo-update

      - name: Inject GoogleService-Info.plist
        run: |
          # 1. Find the file
          GS_PATH=$(find . -name "GoogleService-Info.plist" | head -n 1)
          
          if [ -z "$GS_PATH" ]; then
            echo "ERROR: GoogleService-Info.plist NOT FOUND in the repository!"
            exit 1
          fi

          # 2. Only copy if it's not already in the correct spot
          TARGET_DEST="ios/Runner/GoogleService-Info.plist"
          if [ "$GS_PATH" != "./$TARGET_DEST" ] && [ "$GS_PATH" != "$TARGET_DEST" ]; then
            echo "Moving file from $GS_PATH to $TARGET_DEST"
            cp "$GS_PATH" "$TARGET_DEST"
          else
            echo "File is already in the correct location."
          fi
          
          # 3. Register in Xcode (Fixed for Mac Runners)
          # We use 'perl' instead of 'sed' because it works exactly the same on Windows, Mac, and Linux
          PBX_PATH="ios/Runner.xcodeproj/project.pbxproj"
          perl -i -pe 'print "\t\tD73872AD237909A100904033 /* GoogleService-Info.plist in Resources */ = {isa = PBXBuildFile; fileRef = D73872AC237909A100904033 /* GoogleService-Info.plist */; };\n" if /AppDelegate.swift/ && !seen_build_file++' "$PBX_PATH"
          perl -i -pe 'print "\t\tD73872AC237909A100904033 /* GoogleService-Info.plist */ = {isa = PBXFileReference; fileEncoding = 4; lastKnownFileType = text.plist.xml; path = \"GoogleService-Info.plist\"; sourceTree = \"<group>\"; };\n" if /AppDelegate.swift/ && !seen_file_ref++' "$PBX_PATH"
          
      - name: Build iOS App Bundle
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload
          zip -r YourTutorApp.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: my-ios-app
          path: YourTutorApp.ipa