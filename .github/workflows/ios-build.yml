name: "Free iOS Build"

on:
  push:
    branches: [ main ]  # Runs automatically when you push to main
  workflow_dispatch:     # Allows you to click "Run workflow" manually from GitHub

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      # This step ensures the Flutter/Generated.xcconfig exists so Podfile can find FLUTTER_ROOT
      - name: Pre-build iOS to generate config
        run: flutter build ios --release --no-codesign --config-only

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS App Bundle
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          # Moving the .app bundle into the Payload folder is what makes it an IPA
          mv build/ios/iphoneos/Runner.app Payload
          zip -r YourTutorApp.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: my-ios-app
          path: YourTutorApp.ipa