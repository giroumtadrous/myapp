name: "Free iOS Build"

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Force iOS 15.1 Target
        run: |
          # This command finds any remaining 13.0 references and forces them to 15.1
          find ios -type f -name "*.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0/IPHONEOS_DEPLOYMENT_TARGET = 15.1/g' {} +
          find ios -type f -name "*.plist" -exec sed -i '' 's/13.0/15.1/g' {} +

      - name: Create iOS Build Config
        run: flutter build ios --release --no-codesign --config-only

      - name: Install CocoaPods
        run: |
          cd ios
          rm -rf Podfile.lock
          pod install --repo-update

      - name: Inject GoogleService-Info.plist
        run: |
          # 1. Ensure the file is exactly where it needs to be
          cp ios/Runner/GoogleService-Info.plist . || true
          cp GoogleService-Info.plist ios/Runner/GoogleService-Info.plist || true

          # 2. Register in Xcode project file
          # We use a simpler sed command that avoids the 'seen' variable error
          PBX_PATH="ios/Runner.xcodeproj/project.pbxproj"
          
          echo "Registering file in $PBX_PATH..."
          
          # Insert the Build File reference
          sed -i '' '/AppDelegate.swift/a\'$'\n''		D73872AD237909A100904033 /* GoogleService-Info.plist in Resources */ = {isa = PBXBuildFile; fileRef = D73872AC237909A100904033 /* GoogleService-Info.plist */; };' "$PBX_PATH"
          
          # Insert the File Reference
          sed -i '' '/AppDelegate.swift/a\'$'\n''		D73872AC237909A100904033 /* GoogleService-Info.plist */ = {isa = PBXFileReference; fileEncoding = 4; lastKnownFileType = text.plist.xml; path = "GoogleService-Info.plist"; sourceTree = "<group>"; };' "$PBX_PATH"
          
          echo "Injection complete."
          
      - name: Build iOS App Bundle
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload
          zip -r YourTutorApp.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: my-ios-app
          path: YourTutorApp.ipa