<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Flutter Tutoring Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4051b5",
                        "background-light": "#f6f6f8",
                        "background-dark": "#14161e",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4">
<!-- Main Container -->
<div class="relative w-full max-w-md bg-white dark:bg-slate-900 shadow-2xl rounded-xl overflow-hidden border border-slate-200 dark:border-slate-800">
<!-- Header Section -->
<div class="p-6 pb-2">
<div class="flex items-center justify-between mb-8">
<button class="text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 p-2 rounded-full transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex items-center gap-2">
<div class="bg-primary size-8 rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-white text-xl">school</span>
</div>
<span class="font-bold text-lg tracking-tight">Flutter Academy</span>
</div>
<div class="w-10"></div>
</div>
<div class="text-center mb-8">
<div class="w-full h-32 bg-primary/10 rounded-xl mb-6 flex items-center justify-center overflow-hidden">
<img alt="Illustration of a person learning Flutter" class="object-cover w-full h-full opacity-80" data-alt="Modern digital illustration of coding on a laptop" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBAr4OU1xKsWlja2TPbkDy-hft0nMInGsElv7NVpRk_4kXeLJa6Li845_4vNFhfQBgxqEnHbkAj1c8ejRzK6WmDs0thAs21lIEwZCSWi3aRd_q3sXm-ACoVAxzd2OuPjoko92JREVuxfmdZWx42gyJNtZoqJ-WrrtxsBmuONFr2pi4-FivRdIwe0vHJX8goMv9oQoIhbI-eJvTzjO5HR-rLUwEAuVQ578e7pLwzCv2LJZKXVNTYgucs7OEUoX9sEwLAFADNzc6Rh4OE"/>
</div>
<h1 class="text-3xl font-bold mb-2">Welcome back</h1>
<p class="text-slate-500 dark:text-slate-400">Enter your credentials to access your dashboard</p>
</div>
</div>
<!-- Form Section -->
<div class="px-6 pb-8">
<!-- Role Toggle -->
<div class="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl mb-6">
<label class="flex-1 cursor-pointer">
<input checked="" class="peer hidden" name="role" type="radio" value="student"/>
<div class="text-center py-2.5 rounded-lg peer-checked:bg-white dark:peer-checked:bg-slate-700 peer-checked:shadow-sm peer-checked:text-primary transition-all text-slate-500 font-medium text-sm">
                        Student
                    </div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer hidden" name="role" type="radio" value="tutor"/>
<div class="text-center py-2.5 rounded-lg peer-checked:bg-white dark:peer-checked:bg-slate-700 peer-checked:shadow-sm peer-checked:text-primary transition-all text-slate-500 font-medium text-sm">
                        Tutor
                    </div>
</label>
</div>
<!-- Inputs -->
<div class="space-y-4">
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">mail</span>
<input class="w-full pl-11 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border-none rounded-xl focus:ring-2 focus:ring-primary ring-inset transition-all outline-none" placeholder="Email address" type="email"/>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
<input class="w-full pl-11 pr-12 py-3 bg-slate-50 dark:bg-slate-800 border-none rounded-xl focus:ring-2 focus:ring-primary ring-inset transition-all outline-none" placeholder="Password" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<div class="flex justify-end mt-2 mb-8">
<a class="text-sm font-medium text-primary hover:underline" href="#">Forgot password?</a>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/30 transition-all flex items-center justify-center gap-2 group">
                Sign In
                <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<!-- Sign Up Link -->
<p class="text-center mt-8 text-slate-500 text-sm">
                Don't have an account? 
                <a class="text-primary font-bold hover:underline" href="#">Create account</a>
</p>
</div>
<!-- Optional Loading Overlay (Hidden by default, used for state simulation) -->
<div class="hidden absolute inset-0 bg-white/80 dark:bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center">
<div class="flex flex-col items-center">
<div class="size-12 border-4 border-primary/20 border-t-primary rounded-full animate-spin mb-4"></div>
<p class="font-medium text-primary">Authenticating...</p>
</div>
</div>
</div>
</body></html>
